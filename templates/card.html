<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFMShop - Карточка товара</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 40px;
    }

    .product-card {
      width: 280px;
      background-color: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }

    .product-card h2 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #333;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: #4CAF50;
      margin-bottom: 15px;
    }

    .add-to-cart {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
    }

    .add-to-cart:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="product-card">
    <h2>Кроссовки SFM Runner</h2>
    <div class="price">5 990 ₽</div>
    <button class="add-to-cart">В корзину</button>
  </div>
</body>
</html>
