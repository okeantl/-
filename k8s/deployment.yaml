apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfmshop-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sfmshop
  template:
    metadata:
      labels:
        app: sfmshop
    spec:
      containers:
        - name: app
          image: sfmshop:latest
          ports:
            - containerPort: 8000
          env:
            # значения приходят из Secret (см. раздел Secrets),
            # а не лежат открытым текстом в манифесте
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: REDIS_URL
